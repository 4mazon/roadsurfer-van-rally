preview = true
line-length = 100
target-version = "py314"
extend-exclude = [".venv-backup-*"]
[lint]
select = [
	"E",    # pycodestyle errors
	"F",    # pyflakes
	"W",    # pycodestyle warnings (incluye W291 y W292)
	"I",    # isort
	"N",    # pep8-naming
	"UP",   # pyupgrade
	"C90",  # mccabe
	"D",    # pydocstyle
	"ANN",  # flake8-annotations
	"B",    # flake8-bugbear
	"A",    # flake8-builtins
	"C4",   # flake8-comprehensions
	"T20",  # flake8-print
	"SIM",  # flake8-simplify
	"Q",    # flake8-quotes
	"PL",   # pylint
	"RUF",   # ruff-specific rules
	"too-many-blank-lines"   # too many blank lines
]
ignore = [
	"undocumented-public-module", # Missing docstring in public module
	"undocumented-public-package", # Missing docstring in public package
	"incorrect-blank-line-before-class", # Match Ruff formatter: no blank line before class docstring
	"multi-line-summary-first-line", # Multi-line summary should start at the first line (conflicts with D213)
	"print", # Allow print statements in CLI/console scripts
]
fixable = ["ALL"]
unfixable = []

[lint.per-file-ignores]
"tests/**" = [
    "no-self-use",  # test methods don't need to be module-level
    "magic-value-comparison",  # allow magic values in tests
	"import-private-name",  # allow importing private functions in tests
	"any-type",   # allow Any in test mocks
]

[format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"
