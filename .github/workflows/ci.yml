name: CI

on:
  push:
    branches: [main, 'feature/**', 'chore/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Lint and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install development tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Lint and check formatting
        run: |
          python -m ruff check .
          python -m ruff format --check .
      - name: Build sdist, then build wheel from sdist
        run: python -m build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  tests:
    name: Installed package (${{ matrix.os }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Install wheel with runtime dependencies only
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          import sys
          wheel, = Path("dist").glob("*.whl")
          subprocess.run([sys.executable, "-m", "pip", "install", str(wheel)], check=True)
      - name: Smoke-test installed CLI outside the checkout
        run: python tests/smoke_installed.py
      - name: Install test tools from the wheel's dev extra (not an editable checkout)
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          import sys
          wheel, = Path("dist").glob("*.whl")
          subprocess.run([sys.executable, "-m", "pip", "install", f"{wheel}[dev]"], check=True)
      - name: Run tests with coverage
        run: >-
          python -m pytest --cov=van_rally --cov-report=term-missing
          --cov-report=html --cov-report=xml --cov-fail-under=80
      - name: Upload coverage to Codecov
        if: runner.os == 'Linux'
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.os }}
          path: htmlcov/

  # These names are required by main's branch protection. Keep them stable even
  # when the implementation jobs above are renamed or expanded into a matrix.
  required-lint:
    name: Ruff Lint
    needs: build
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require successful lint and build
        env:
          UPSTREAM_RESULTS: ${{ toJSON(needs) }}
        shell: python
        run: |
          import json
          import os
          import sys
          results = json.loads(os.environ["UPSTREAM_RESULTS"])
          sys.exit(0 if results and all(job["result"] == "success" for job in results.values()) else 1)

  required-tests:
    name: Run Tests
    needs: [build, tests]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require successful installed-package tests on every OS
        env:
          UPSTREAM_RESULTS: ${{ toJSON(needs) }}
        shell: python
        run: |
          import json
          import os
          import sys
          results = json.loads(os.environ["UPSTREAM_RESULTS"])
          sys.exit(0 if results and all(job["result"] == "success" for job in results.values()) else 1)

  required-coverage:
    name: Coverage (fail if < 80%)
    needs: [build, tests]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      # The tests matrix enforces --cov-fail-under=80 on every OS.
      - name: Require successful coverage enforcement on every OS
        env:
          UPSTREAM_RESULTS: ${{ toJSON(needs) }}
        shell: python
        run: |
          import json
          import os
          import sys
          results = json.loads(os.environ["UPSTREAM_RESULTS"])
          sys.exit(0 if results and all(job["result"] == "success" for job in results.values()) else 1)
